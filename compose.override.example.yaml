# Optional (118). compose.yaml already serves the app on 127.0.0.1:4545 and 127.0.0.1:3000.
# Copy this to compose.override.yaml (gitignored) when you need other host ports, your uid:gid,
# project mounts (needed to connect a project), or a custom image:
#   cp compose.override.example.yaml compose.override.yaml && docker compose up --build
#
# Ports: Compose concatenates `ports` across files, so a plain `ports:` here would publish your
# port and the default one too. `ports: !override` replaces compose.yaml's list instead
# (needs Docker Compose v2.24.4 or later: `docker compose version`). Change only the left
# number, the host port, and keep 127.0.0.1 so nothing is published beyond this machine (§4.5).
services:
  backend:
    # Runs get git, uv, node, and npm. For more tools, write a Dockerfile of your own (028 Q10):
    #   FROM workcell-backend
    #   RUN apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*
    # run `docker compose build backend`, then `docker build -t my-backend .` in that Dockerfile's
    # folder, and uncomment these two lines, so compose runs your image instead of building ours:
    # image: my-backend
    # build: !reset null
    # your `id -u`:`id -g`, so worktree files stay yours and git doesn't call them "dubious ownership"
    user: "501:20"
    ports: !override
      # change the left number; then fctl on the host needs FCTL_URL=http://127.0.0.1:<port>
      - "127.0.0.1:4545:4545"
    volumes:
      # Mount every root that holds a connected project at its host path, because projects
      # store the host paths from `fctl connect`. One line per root.
      - /path/to/code:/path/to/code

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"   # change the left number; the app is then http://127.0.0.1:<port>
