[project]
name = "claude-factories"
version = "0.1.0"
description = "A local software factory for Claude Code"
authors = [
    { name = "ArtemKucheruk", email = "a.o.kucheruk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
fctl = "claude_factories.cli:main"

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
