<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #fff; --ink: #1b1f24; --muted: #687080; --line: #e1e4e8;
    --accent: #2563eb; --pass: #16803c; --fail: #cf2e2e; --pending: #a0a7b2;
    --add: #e7f6ec; --del: #fdecec; --hunk: #eef3fd; --alert: #fff3f2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b21; --ink: #e5e7eb; --muted: #949bab; --line: #2a2f38;
      --accent: #6b9cff; --pass: #4ac26b; --fail: #ff6b6b; --pending: #5f6672;
      --add: #12301c; --del: #3b1819; --hunk: #1a2436; --alert: #2a1517;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 18px 20px 10px; }
  h1 { margin: 0; font-size: 16px; }
  .muted { color: var(--muted); font-size: 12px; }
  #status { margin-left: auto; }
  #status.err { color: var(--fail); }
  main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 6px 20px 28px; align-items: start; }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
  button.card { cursor: pointer; }
  button.card:hover, button.card:focus-visible { border-color: var(--accent); outline: none; }
  .card.human_review { border-left: 3px solid var(--accent); }
  .card.escalated { border-left: 3px solid var(--fail); background: var(--alert); }
  .id { font: 12px var(--mono); color: var(--muted); }
  .title { margin: 2px 0 6px; font-weight: 500; }
  .line { color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .stage { font-size: 12px; color: var(--muted); }
  .human_review .stage { color: var(--accent); font-weight: 600; }
  .escalated .stage { color: var(--fail); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; font: 11px var(--mono); }
  .chip { padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--pending); }
  .chip.PASS { color: var(--pass); border-color: currentColor; }
  .chip.CHANGES { color: var(--fail); border-color: currentColor; }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 2px; }

  dialog { width: min(1100px, calc(100vw - 32px)); height: min(85vh, 900px); padding: 0; border: 1px solid var(--line);
           border-radius: 10px; background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .dlg { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .dhead { display: flex; align-items: start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dhead .title { margin: 0; font-size: 15px; }
  .close { margin-left: auto; padding: 4px 8px; font: inherit; font-size: 20px; line-height: 1; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .dbody { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 0; }
  nav { padding: 6px 8px; overflow: auto; border-right: 1px solid var(--line); }
  nav .group { margin: 10px 6px 4px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  nav button { display: block; width: 100%; padding: 4px 6px; text-align: left; font: 12px var(--mono); color: inherit; background: none; border: 0; border-radius: 6px; cursor: pointer; }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--hunk); color: var(--accent); }
  article { overflow: auto; padding: 14px 20px 28px; }

  article h3 { margin: 16px 0 6px; font-size: 17px; }
  article h4, article h5, article h6 { margin: 16px 0 4px; font-size: 14px; }
  article p { margin: 4px 0; }
  article code { padding: 1px 4px; font: 12px var(--mono); background: var(--bg); border-radius: 4px; }
  article pre { padding: 10px 12px; overflow: auto; font: 12px/1.5 var(--mono); background: var(--bg); border-radius: 6px; }
  .li { margin: 2px 0; }
  .mono { font: 12px var(--mono); white-space: pre; overflow-x: auto; }
  .verdict { font-weight: 700; }
  .ok, .plus { color: var(--pass); }
  .bad, .minus { color: var(--fail); }

  details.file { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; }
  details.file summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 10px; font: 12px var(--mono); background: var(--bg); cursor: pointer; }
  pre.diff { margin: 0; padding: 4px 0; border-radius: 0; background: none; }
  pre.diff span { display: block; width: max-content; min-width: 100%; padding: 0 10px; }
  .add { background: var(--add); } .del { background: var(--del); } .hunk { background: var(--hunk); color: var(--muted); }

  @media (max-width: 860px) {
    header { padding: 16px 16px 8px; }
    main { grid-template-columns: 1fr; padding: 6px 16px 24px; }
    .dbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    nav { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="muted">spec → build → security · ux · ui · code → approver → you</span>
  <span id="status" class="muted"></span>
</header>
<main id="board"></main>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="dlg">
    <div class="dhead">
      <div><div class="id" id="did"></div><div class="title" id="dtitle"></div><div class="muted" id="dmeta"></div></div>
      <button class="close" aria-label="Close" onclick="dlg.close()">×</button>
    </div>
    <div class="dbody"><nav id="dnav"></nav><article id="dview"></article></div>
  </div>
</dialog>

<script>
const REVIEWERS = ['security', 'ux', 'ui', 'code'];
const SHORT = { security: 'sec', ux: 'ux', ui: 'ui', code: 'code' };
const MARK = { PASS: '✓', CHANGES: '✗' };
const COLUMNS = [['backlog', 'Backlog'], ['in_progress', 'In progress'], ['review', 'Review'], ['done', 'Done']];
const pastRounds = new Map();  // "id/n" → verdicts; a finished round never changes
let jobs = [], lastKey = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

async function get(path) {
  try {
    const r = await fetch(path, { cache: 'no-store' });
    return r.ok ? await r.text() : null;
  } catch { return null; }
}

// Same rule as the orchestrator: anything but "VERDICT: PASS" counts as CHANGES.
async function verdict(path) {
  const t = await get(path);
  return t === null ? 'pending' : t.split('\n')[0].trim() === 'VERDICT: PASS' ? 'PASS' : 'CHANGES';
}

// One row of verdicts per round: the current round from board.json, past rounds from their files.
async function roundsOf(job) {
  const rows = [];
  for (let n = 1; n <= job.round; n++) {
    if (n === job.round) { rows.push(job.reviews || {}); continue; }
    const key = `${job.id}/${n}`;
    if (!pastRounds.has(key)) {
      const v = await Promise.all(REVIEWERS.map(r => verdict(`jobs/${job.id}/round-${n}/review-${r}.md`)));
      pastRounds.set(key, Object.fromEntries(REVIEWERS.map((r, i) => [r, v[i]])));
    }
    rows.push(pastRounds.get(key));
  }
  return rows;
}

function stageLabel(j) {
  if (j.stage === 'human_review') return 'waiting on you';
  if (j.stage === 'escalated') return '⚠ needs you · escalated';
  if (j.status === 'done') return `done · ${j.round} round${j.round === 1 ? '' : 's'}`;
  return `● ${j.stage}${j.round ? ' · round ' + j.round : ''}`;
}

const chips = rows => rows.map((v, i) => `<div class="chips"><span class="muted">r${i + 1}</span>${REVIEWERS.map(r => {
  const x = v[r] || 'pending';
  return `<span class="chip ${esc(x)}" title="${r}: ${esc(x)}">${SHORT[r]} ${MARK[x] || '·'}</span>`;
}).join('')}</div>`).join('');

async function render(board, backlog) {
  jobs = board.jobs || [];
  const known = new Set(jobs.map(j => j.id));
  const cols = { backlog: [], in_progress: [], review: [], done: [] };
  for (const [, id, text] of backlog.matchAll(/^- \[ \] (\S+?):\s*(.*)$/gm)) {
    if (!known.has(id)) cols.backlog.push(`<div class="card"><div class="id">${esc(id)}</div><div class="line" title="${esc(text)}">${inline(text)}</div></div>`);
  }
  for (const j of jobs) {
    (cols[j.status] ||= []).push(`<button class="card ${esc(j.stage || '')}" data-id="${esc(j.id)}">
      <div class="id">${esc(j.id)}</div><div class="title">${esc(j.title)}</div>
      <div class="stage">${esc(stageLabel(j))}</div>${chips(await roundsOf(j))}</button>`);
  }
  cols.done.reverse();
  document.getElementById('board').innerHTML = COLUMNS.map(([k, name]) =>
    `<section><h2>${name} ${cols[k].length}</h2>${cols[k].join('') || '<div class="empty">Nothing here</div>'}</section>`).join('');
}

async function tick() {
  const st = document.getElementById('status');
  const fail = msg => { st.textContent = msg; st.className = 'muted err'; };
  const [board, backlog] = await Promise.all([get('board.json'), get('backlog.md')]);
  if (board === null) return fail('board.json not reachable. Serve factory/: python3 -m http.server -b 127.0.0.1 -d factory');
  let parsed;
  try { parsed = JSON.parse(board); } catch { return fail('board.json is mid-write or invalid, retrying'); }
  const key = board + '\0' + backlog;
  if (key !== lastKey) { await render(parsed, backlog || ''); lastKey = key; }
  st.textContent = 'live · ' + new Date().toLocaleTimeString();
  st.className = 'muted';
}
(async function loop() { await tick(); setTimeout(loop, 3000); })();

// Markdown, small subset: headings, fences, bullets, checkboxes, tables as monospace, inline code, bold.
function md(src) {
  let out = '', code = false, m;
  for (const line of src.split('\n')) {
    if (/^\s*```/.test(line)) { out += code ? '</pre>' : '<pre>'; code = !code; continue; }
    if (code) { out += esc(line) + '\n'; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) out += `<h${m[1].length + 2}>${inline(m[2])}</h${m[1].length + 2}>`;
    else if ((m = line.match(/^\s*(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\s*$/))) out += `<p class="verdict ${/PASS|APPROVE/.test(m[2]) ? 'ok' : 'bad'}">${esc(line.trim())}</p>`;
    else if ((m = line.match(/^(\s*)[-*]\s+(?:\[([ xX])\]\s+)?(.*)/))) out += `<div class="li" style="padding-left:${m[1].length * 8}px">${m[2] ? (m[2] === ' ' ? '☐' : '☑') : '•'} ${inline(m[3])}</div>`;
    else if (line.trim().startsWith('|')) out += `<div class="mono">${esc(line)}</div>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (code ? '</pre>' : '');
}

// Unified diff → one block per file with +N −M; big files (lockfiles, vendored js) start collapsed.
function diff(text) {
  const files = text.split(/^(?=diff --git )/m).filter(f => f.startsWith('diff --git '));
  if (!files.length) return '<p class="muted">No changes.</p>';
  let adds = 0, dels = 0;
  const parts = files.map(f => {
    const lines = f.replace(/\n$/, '').split('\n');
    const path = (lines[0].match(/ b\/(.+)$/) || [, lines[0]])[1];
    let add = 0, del = 0, inHunk = false, body = '';
    const tags = [];
    for (const l of lines.slice(1)) {
      if (!inHunk && !l.startsWith('@@')) {
        if (l.startsWith('new file')) tags.push('new');
        else if (l.startsWith('deleted file')) tags.push('deleted');
        else if (l.startsWith('rename from ')) tags.push('from ' + l.slice(12));
        else if (l.startsWith('Binary files')) tags.push('binary');
        continue;
      }
      inHunk = true;
      const c = l.startsWith('@@') ? 'hunk' : l[0] === '+' ? (add++, 'add') : l[0] === '-' ? (del++, 'del') : '';
      body += `<span class="${c}">${esc(l) || ' '}</span>`;
    }
    adds += add; dels += del;
    return `<details class="file"${lines.length > 400 ? '' : ' open'}><summary><span>${esc(path)}</span>`
      + tags.map(t => `<span class="muted">(${esc(t)})</span>`).join('')
      + `<span class="plus">+${add}</span><span class="minus">−${del}</span></summary>`
      + (body ? `<pre class="diff">${body}</pre>` : '') + '</details>';
  });
  return `<p>${files.length} file${files.length === 1 ? '' : 's'} changed <span class="plus">+${adds}</span> <span class="minus">−${dels}</span></p>` + parts.join('');
}

async function openJob(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  const names = ['spec.md'];
  for (let n = 1; n <= j.round; n++) {
    names.push(`feedback-${n}.md`, ...['build.md', 'diff.patch', ...REVIEWERS.map(r => `review-${r}.md`)].map(f => `round-${n}/${f}`));
  }
  names.push('decision.md');
  const texts = await Promise.all(names.map(n => get(`jobs/${j.id}/${n}`)));

  const entries = [
    { group: 'job', label: 'request', html: () => md(j.description || '') },
    { group: 'job', label: 'history', html: () => (j.history || []).map(h =>
        `<div class="mono">${esc(h.at)}  ${esc(h.status)}${h.stage ? ' · ' + esc(h.stage) : ''}</div>`).join('') },
  ];
  names.forEach((n, i) => {
    if (texts[i] === null) return;
    const m = n.match(/^(?:round-(\d+)\/|feedback-(\d+)\.md$)/);
    entries.push({
      group: m ? 'round ' + (m[1] || m[2]) : n === 'decision.md' ? 'decision' : 'job',
      label: m && m[1] ? n.slice(m[0].length) : n,
      html: () => n.endsWith('.patch') ? diff(texts[i]) : md(texts[i]),
    });
  });

  document.getElementById('did').textContent = j.id;
  document.getElementById('dtitle').textContent = j.title;
  document.getElementById('dmeta').textContent = [j.status, j.stage, j.branch].filter(Boolean).join(' · ');
  const nav = document.getElementById('dnav'), view = document.getElementById('dview');
  let html = '', group = '';
  entries.forEach((e, i) => {
    if (e.group !== group) { group = e.group; html += `<div class="group">${esc(group)}</div>`; }
    html += `<button data-i="${i}">${esc(e.label)}</button>`;
  });
  nav.innerHTML = html;
  const show = i => {
    view.innerHTML = entries[i].html();
    view.scrollTop = 0;
    nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === i)));
  };
  nav.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  const pick = label => entries.findIndex(e => e.label === label);
  show(Math.max(pick('decision.md'), pick('spec.md'), 0));
  dlg.showModal();
}

document.getElementById('board').addEventListener('click', e => {
  const card = e.target.closest('button.card');
  if (card) openJob(card.dataset.id);
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
