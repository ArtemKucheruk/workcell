<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Claude Factories{% endblock %}</title>
  <link rel="stylesheet" href="/static/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/static/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/highlight.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; line-height: 1.4; }
    table { border-collapse: collapse; margin-block: 1rem; }
    th, td { padding: .35rem .75rem; text-align: left; border-bottom: 1px solid GrayText; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: GrayText; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: start; }
    .toolbar form { display: grid; gap: .5rem; margin-top: .5rem; }
    #board-error { font-weight: bold; }
    #board { display: grid; grid-template-columns: repeat(4, minmax(11rem, 1fr)); gap: 1rem; align-items: start; overflow-x: auto; }
    .column { border: 1px solid GrayText; border-radius: 6px; padding: .5rem; min-height: 8rem; }
    .column h2 { font-size: 1rem; margin: 0 0 .5rem; }
    .column ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    .card { border: 1px solid GrayText; border-radius: 6px; padding: .5rem; cursor: grab; }
    .card p { margin: .25rem 0 0; }
    .card.dragging { opacity: .5; }
    .chips, .diff { font-variant-numeric: tabular-nums; }
    /* Q3: the only hard-coded color; light-dark keeps contrast in both schemes */
    .card.escalated { border-left: 4px solid light-dark(#cf222e, #f85149); }
    .escalated .badge, #status .escalated { color: light-dark(#cf222e, #f85149); font-weight: bold; }
    /* Review page (docs/ui.md §8.2) */
    .review-meta { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; }
    .review-meta form { display: inline; }
    .round { border-bottom: 1px solid GrayText; padding-block: .25rem; }
    .round-row { display: flex; flex-wrap: wrap; gap: 1rem; margin: .25rem 0; }
    .chips span + span { margin-left: .5rem; }
    details.verdict { margin-left: 1rem; }
    details.verdict summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #timeline ol { list-style: none; padding: 0; display: grid; gap: .25rem; }
    #timeline time { color: GrayText; font-variant-numeric: tabular-nums; margin-right: .5rem; }
    #timeline li > :not(time) { margin: .25rem 0 0 1rem; }
    .comment-box { display: grid; gap: .5rem; max-width: 48rem; }
    .form-error { margin: 0; font-weight: bold; color: light-dark(#cf222e, #f85149); }  /* the escalated red */
    /* Files changed (docs/ui.md §8.3) */
    .tabs { display: flex; gap: 1rem; border-bottom: 1px solid GrayText; margin-block: 1rem; }
    .tabs a { padding: .25rem .5rem; text-decoration: none; }
    .tabs a[aria-current="page"] { font-weight: bold; border-bottom: 2px solid currentColor; }
    .files-layout { display: grid; grid-template-columns: minmax(10rem, 16rem) minmax(0, 1fr); gap: 1rem; align-items: start; }
    @media (max-width: 48rem) { .files-layout { grid-template-columns: minmax(0, 1fr); } }
    #file-tree { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    #file-tree ul { list-style: none; margin: 0; padding-left: 1rem; }
    #file-tree > ul { padding-left: 0; }
    .file-header { display: flex; flex-wrap: wrap; gap: .5rem; font-size: 1rem; margin: 1rem 0 .25rem; }
    .file-header .diff { margin-left: auto; }
    .diff-scroll { overflow-x: auto; border: 1px solid GrayText; border-radius: 6px; }
    .diff-table { margin: 0; min-width: 100%; font-family: ui-monospace, monospace; font-size: .85rem; }
    .diff-table td { padding: 0 .5rem; border: 0; white-space: pre; vertical-align: top; }
    .diff-table td.num, .diff-table td.sign { width: 1%; user-select: none; }
    .diff-table td.num a { color: GrayText; text-decoration: none; }
    .diff-table td.num a:hover, .diff-table td.num a:focus { text-decoration: underline; }
    .diff-table tr.hunk td, .diff-table tr.note td { color: GrayText; }
    /* Q9: GitHub's diff backgrounds, the only new hard-coded colors */
    .diff-table tr.add { background: light-dark(#e6ffec, #2ea04326); }
    .diff-table tr.del { background: light-dark(#ffebe9, #f851491a); }
    .diff-table tr.comments td, .diff-table tr.comment-form td {
      white-space: normal; font-family: system-ui, sans-serif; padding: .5rem; border-block: 1px solid GrayText; }
    .diff-table .comment, .diff-table .comment-box { position: sticky; left: .5rem; max-width: min(48rem, 80vw); }
    .comment + .comment { margin-top: .5rem; }
    .comment > p { margin: .25rem 0 0; }
    code.hljs { background: transparent; padding: 0; }
    /* Code page (docs/ui.md §8 item 6) */
    #file-tree summary { cursor: pointer; }
    #file-tree a[aria-current="page"] { font-weight: bold; }
    .code-view { display: flex; overflow-x: auto; border: 1px solid GrayText; border-radius: 6px; }
    .code-view pre { margin: 0; padding: .5rem; font: .85rem/1.4 ui-monospace, monospace; }
    .code-view .gutter { position: sticky; left: 0; background: Canvas; color: GrayText; text-align: right;
      user-select: none; border-right: 1px solid GrayText; }
    .code-view code { font: inherit; }  /* the gutter's line height, so numbers line up */
    .code-view code.hljs { display: inline; padding: 0; overflow: visible; }
  </style>
</head>
<body hx-headers='{"X-Requested-By": "fctl"}'>
{% block content %}{% endblock %}
</body>
</html>
