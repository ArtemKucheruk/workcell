{% extends "base.html" %}
{% block title %}{{ project.name }} · Claude Factories{% endblock %}
{% block content %}
<header>
  <p><a href="/">Claude Factories</a></p>
  <h1>{{ project.name }} · <a href="/workspaces/{{ project.workspace_id }}">{{ project.workspace }}</a></h1>
  <p class="muted">{{ project.path }}</p>
</header>
<main>
<form hx-post="/projects/{{ project.id }}/workspace">
  <label>Workspace
    <select name="workspace_id">
      {% for w in workspaces %}
      <option value="{{ w.id }}"{% if w.id == project.workspace_id %} selected{% endif %}>{{ w.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button>Move</button>
</form>
</main>
{% endblock %}
